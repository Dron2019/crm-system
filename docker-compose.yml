services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: crm-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      # .env targets services on the host (127.0.0.1); inside the network use service names
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      MAIL_HOST: mailpit
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - crm
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crm
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: crm-mysql
    restart: unless-stopped
    # Migrations create triggers; without this a non-SUPER user can't while binlog is on
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP ping: the temporary init server listens on the socket only, so this waits for the real one
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - crm

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: crm-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - crm

  minio:
    image: minio/minio:latest
    # Opt-in (`docker compose --profile s3 up`): the app uses local disks for now, and
    # minio/minio is no longer pullable from Docker Hub — swap in a working S3 image first
    profiles: ["s3"]
    container_name: crm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: crm
      MINIO_ROOT_PASSWORD: secretkey
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - crm

  mailpit:
    image: axllent/mailpit:latest
    container_name: crm-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - crm

volumes:
  mysql_data:
  redis_data:
  meilisearch_data:
  minio_data:

networks:
  crm:
    driver: bridge
